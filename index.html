<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas · 本地 AI Agent</title>
    <script>
      /* 首屏按已保存的主题上色，避免先闪浅色再切深色 */
      (function () {
        try {
          var stored = localStorage.getItem('atlas.theme');
          var mode =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = mode;
        } catch (e) {}
      })();
    </script>
    <style>
      /* ⚠️ 首屏不闪白底：先定住背景色，等 token 加载完再切 */
      html { background: #efeae2; color: #1c1915; }
      html[data-theme='dark'] { background: #111614; color: #ece8e1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
